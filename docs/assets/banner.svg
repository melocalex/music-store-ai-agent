<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="banner-title banner-desc">
  <title id="banner-title">Aria, virtual assistant for Empório da Música</title>
  <desc id="banner-desc">A guitar soundhole with strings, next to the name Aria. Prices, stock, orders, and policy come from the store's own data.</desc>
  <defs>
    <linearGradient id="banner-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10291F"/>
      <stop offset="1" stop-color="#1F4B3A"/>
    </linearGradient>
    <radialGradient id="banner-hole" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#07140F"/>
      <stop offset="1" stop-color="#143628"/>
    </radialGradient>
    <linearGradient id="banner-string" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0.02" stop-color="#E7C56A" stop-opacity="0"/>
      <stop offset="0.08" stop-color="#E7C56A" stop-opacity="0.85"/>
      <stop offset="0.2" stop-color="#E7C56A" stop-opacity="0.85"/>
      <stop offset="0.265" stop-color="#E7C56A" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" rx="28" fill="url(#banner-bg)"/>
  <g fill="none" stroke="#E7C56A">
    <circle cx="190" cy="150" r="108" stroke-width="7"/>
    <circle cx="190" cy="150" r="94" stroke-width="2" stroke-opacity="0.6" stroke-dasharray="3 7"/>
  </g>
  <circle cx="190" cy="150" r="82" fill="url(#banner-hole)"/>
  <g stroke="url(#banner-string)" stroke-width="2.5">
    <line x1="0" y1="95" x2="1200" y2="95"/>
    <line x1="0" y1="117" x2="1200" y2="117"/>
    <line x1="0" y1="139" x2="1200" y2="139"/>
    <line x1="0" y1="161" x2="1200" y2="161"/>
    <line x1="0" y1="183" x2="1200" y2="183"/>
    <line x1="0" y1="205" x2="1200" y2="205"/>
  </g>
  <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="1160" y="56" text-anchor="end" font-size="16" letter-spacing="1.5" fill="#D5E6DC" fill-opacity="0.8">PYDANTIC AI · GEMINI · STREAMLIT</text>
    <text x="360" y="136" font-size="80" font-weight="700" fill="#F7F4EF">Aria</text>
    <text x="364" y="186" font-size="30" fill="#D5E6DC">Virtual assistant for Empório da Música</text>
    <text x="364" y="232" font-size="22" fill="#E7C56A">Prices, stock, orders, and policy from the store's own data.</text>
  </g>
</svg>
