<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" role="img" aria-labelledby="flow-title">
  <title id="flow-title">Question, tools, data, then a price check</title>
  <style>
    .bg { fill: #F7F4EF; }
    .box { fill: #E7EFEA; stroke: #14362B; }
    .ink { fill: #14362B; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #10241C; }
      .box { fill: #1C3B2E; stroke: #D5E6DC; }
      .ink { fill: #F7F4EF; }
    }
  </style>
  <rect class="bg" width="1200" height="220" rx="24" fill="#F7F4EF"/>
  <g font-family="Georgia, serif" font-size="22" text-anchor="middle">
    <rect class="box" x="30" y="70" width="180" height="80" rx="16" fill="#E7EFEA" stroke="#14362B" stroke-width="2"/>
    <text class="ink" x="120" y="118" fill="#14362B">Customer</text>
    <rect class="box" x="270" y="70" width="180" height="80" rx="16" fill="#E7EFEA" stroke="#14362B" stroke-width="2"/>
    <text class="ink" x="360" y="118" fill="#14362B">Aria</text>
    <rect class="box" x="510" y="70" width="200" height="80" rx="16" fill="#E7EFEA" stroke="#14362B" stroke-width="2"/>
    <text class="ink" x="610" y="118" fill="#14362B">Typed tools</text>
    <rect class="box" x="770" y="40" width="180" height="70" rx="16" fill="#E7EFEA" stroke="#14362B" stroke-width="2"/>
    <text class="ink" x="860" y="82" fill="#14362B">SQLite</text>
    <rect class="box" x="770" y="120" width="180" height="70" rx="16" fill="#E7EFEA" stroke="#14362B" stroke-width="2"/>
    <text class="ink" x="860" y="162" fill="#14362B">Manual</text>
    <rect class="box" x="990" y="70" width="180" height="80" rx="16" fill="#E7EFEA" stroke="#14362B" stroke-width="2"/>
    <text class="ink" x="1080" y="108" fill="#14362B">Price</text>
    <text class="ink" x="1080" y="136" fill="#14362B">check</text>
  </g>
  <g stroke="#14362B" stroke-width="3" fill="none">
    <path d="M210 110 H270"/>
    <path d="M450 110 H510"/>
    <path d="M710 100 H770"/>
    <path d="M710 130 H770"/>
    <path d="M950 75 H990"/>
    <path d="M950 155 H990"/>
  </g>
</svg>
