- id: budget-violoes
  turns:
    - prompt: Quais violões até 1000 reais vocês têm?
      calls:
        - tool: search_catalog
          args: {query: "violão até 1000", max_price: "1000"}
          contains: ["de 12"]
          excludes: ["Giannini GF-3D", "Shelby SN-7C"]
      reply_contains: ["12 violões à venda nesse teto"]
      reply_excludes: ["R$"]

- id: c40-price
  turns:
    - prompt: Qual o preço do Yamaha C40?
      calls:
        - tool: get_product
          args: {query: "C40"}
          contains: ["599.90"]
          excludes: ["849"]
      reply_contains: ["R$ 599,90"]
      reply_excludes: ["R$ 849,00"]

- id: c40-installments
  turns:
    - prompt: O C40 em 10x fica quanto?
      calls:
        - tool: quote_offer
          args: {query: "C40", quantity: 1, payment: credit, installments: 10}
          contains: ["não é permitido"]
      reply_contains: ["10x não é permitido"]
      reply_excludes: ["R$"]
    - prompt: E em 6x?
      calls:
        - tool: quote_offer
          args: {query: "C40", quantity: 1, payment: credit, installments: 6}
          contains: ["99.98"]
      reply_contains: ["R$ 99,98"]
      reply_excludes: ["10x de"]

- id: gd20-code
  turns:
    - prompt: Vocês têm o GD-20?
      calls:
        - tool: get_product
          args: {query: "GD-20"}
          contains: ["2199.00", "2089.05"]
      reply_contains: ["R$ 2.199,00", "R$ 2.089,05"]
      reply_excludes: ["1.935,12"]

