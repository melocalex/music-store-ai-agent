- id: freight-exact
  turns:
    - prompt: O frete de exatamente 500 reais em Campo Grande é grátis?
      calls:
        - tool: consult_policy
          args: {sections: [frete]}
          contains: ["inclusive no valor exato", "R$ 500,00"]
      reply_contains: ["grátis a partir de R$ 500,00, inclusive"]
      reply_excludes: []

- id: warranty-order
  turns:
    - prompt: Quero a garantia do pedido 7. E-mail leticia.rocha@jmail.com.
      calls:
        - tool: verify_customer
          args: {order_id: 7, email: leticia.rocha@jmail.com}
          contains: ["confirmado"]
      reply_contains: ["Pedido 7 confirmado"]
      reply_excludes: []
    - prompt: A troca por defeito e a garantia ainda valem?
      calls:
        - tool: explain_after_sales
          args: {order_id: 7}
          contains: ["30", "90", "Não aprovo"]
      reply_contains: ["fora do prazo", "90 dias", "Não aprovo"]
      reply_excludes: []

