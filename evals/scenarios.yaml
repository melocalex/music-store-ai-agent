# Each turn has a `stub` script (tool calls and a reply, used only by --stub) and an
# `expect` block (facts scored on stub and live runs alike). The stub never reads `expect`.

- id: budget-violoes
  turns:
    - prompt: Quais violões até 1000 reais vocês têm?
      stub:
        calls:
          - {tool: search_catalog, args: {query: "violão", max_price: "1000"}}
        reply: >-
          Temos 12 violões à venda até R$ 1.000,00. Os mais em conta são o Tagima Memphis AC-39
          por R$ 429,90 e o Rozini RC-104 por R$ 459,90. Quer ver o próximo bloco?
      expect:
        tools: [{tool: search_catalog, args: {max_price: "1000"}}]
        tool_text: {contains: ["de 12."], excludes: ["Giannini GF-3D", "Shelby SN-7C"]}
        amounts: {present: ["429.90"], absent: ["799.90"]}
        reply_any: ["12"]
        reply_none: ["Giannini GF-3D", "Shelby SN-7C"]

- id: c40-price
  turns:
    - prompt: Qual o preço do Yamaha C40?
      stub:
        calls: [{tool: get_product, args: {query: "C40"}}]
        reply: O Yamaha C40 custa R$ 599,90, ou R$ 569,91 no PIX. Posso ajudar em mais alguma coisa?
      expect:
        tools: [{tool: get_product, args: {query: "C40"}}]
        tool_text: {contains: ["599.90", "569.91"], excludes: ["849"]}
        amounts: {present: ["599.90"], absent: ["849.00"]}

- id: c40-installments
  turns:
    - prompt: O C40 em 10x fica quanto?
      stub:
        calls:
          - {tool: quote_offer, args: {query: "C40", payment: credit, installments: 10}}
        reply: >-
          Em 10x não dá: a parcela mínima nessa faixa é R$ 100,00.
          Para o C40 o máximo é 6x, com a primeira parcela de R$ 100,00 e cinco de R$ 99,98.
          Quer seguir em 6x?
      expect:
        tools:
          - {tool: quote_offer, args: {query: {any_of: ["C40", "81"]}, payment: credit, installments: 10}}
        tool_text: {contains: ["10x não é permitido", "Máximo: 6x", "amount=100.00", "99.98"]}
        amounts: {present: ["100.00", "99.98"], absent: ["59.99"]}
        reply_all: ["6x"]
    - prompt: E em 6x?
      stub:
        calls:
          - {tool: quote_offer, args: {query: "C40", payment: credit, installments: 6}}
        reply: >-
          Em 6x o C40 fica com a primeira parcela de R$ 100,00 e cinco de R$ 99,98.
          Posso ajudar em mais alguma coisa?
      expect:
        amounts: {present: ["99.98"], absent: ["59.99"]}
        reply_all: ["6x"]

